# Routes bmad-build's spawns through the harness's agent definitions so the delegation stance
# reaches them: review layers run as `reviewer`, and the implementation subagent runs on the
# builder's tier. Installed into `_bmad/custom/` by `citizen bmad apply`; `citizen bmad check`
# reports when an upstream release renames a key or a layer id. Keys and ids mirror the skill's
# own customize.toml; an entry with a matching id replaces the shipped one, so every field the
# layer needs is repeated here. Why: docs/bmad.md in the harness checkout.

[workflow]

# The runtime adapter owns model choice; this recipe names a semantic role.
implementation_handoff = """
Launch harness role `builder` through the active runtime adapter with fresh context, in the assigned implementation worktree, and this prompt:

> Read {spec_file} in full and implement it. The spec is the only source of truth; load every file its frontmatter `context:` lists before you start.
>
> When you finish, report what you changed, how you verified it, and anything left incomplete or risky.
"""

[[workflow.review_layers]]
id = "blind-hunter"
name = "Blind Hunter"
instruction = """
Launch harness role `reviewer` with `citizen role run reviewer`, using the active `--runtime`, implementation `--workspace`, and a `--prompt-file` containing the brief below. Include `--read-dir` for framework and review-artifact directories outside the worktree. Omit `--model`: the role's class decides it, and only an adapter that reports no model for that class needs the parent's. Read the returned result file as findings data; do not use a native subagent for this constrained role. Run the review layers one at a time: launch this layer only once the previous layer's worker has exited, and never hold two role workers in flight, because a running worker reports no token count until it finishes and a round cannot be held under its cap while its spend is invisible. Brief:

Review the unified diff at `{diff_file}`. Read that file, it is the content under review, then read the changed files around the hunks. Hunt for what is missing as well as what is wrong. Return a Markdown list of findings and nothing else; if the diff is empty, say so and stop. Do not invoke any skill and do not spawn subagents of your own. Return the findings as text in your final message, not through any findings-reporting tool.
"""

[[workflow.review_layers]]
id = "edge-case-hunter"
name = "Edge Case Hunter"
instruction = """
Launch harness role `reviewer` with `citizen role run reviewer`, using the active `--runtime`, implementation `--workspace`, and a `--prompt-file` containing the brief below. Include `--read-dir` for framework and review-artifact directories outside the worktree. Omit `--model`: the role's class decides it, and only an adapter that reports no model for that class needs the parent's. Read the returned result file as findings data; do not use a native subagent for this constrained role. Run the review layers one at a time: launch this layer only once the previous layer's worker has exited, and never hold two role workers in flight, because a running worker reports no token count until it finishes and a round cannot be held under its cap while its spend is invisible. Brief:

Read `{skill-root}/review-prompts/edge-case-hunter.md` completely and follow it as your review instructions; if it is unreadable, report that exact failure and stop. Leave `{claims_file}` unread until those instructions call for it. The content under review is the unified diff at `{diff_file}`; read that file. Do not invoke any skill and do not spawn subagents of your own. Return the findings as text in your final message, not through any findings-reporting tool.
"""

