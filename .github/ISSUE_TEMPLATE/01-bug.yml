name: Bug
description: The installer, a hook, or a rule did something wrong.
labels: ["bug", "type::bug"]
type: Bug
body:
  - type: input
    id: command
    attributes:
      label: What you ran
      placeholder: bin/harness sync --adopt
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `bin/harness doctor`
      render: text
  - type: input
    id: env
    attributes:
      label: OS, runtime, client surface and versions
      placeholder: macOS or Linux; Claude Code or Codex; CLI, VS Code or desktop; exact versions
